spring:
  application:
    name: course-engine
  rabbitmq:
    enabled: true
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 3000ms
    template:
      reply-timeout: 3000ms
  datasource:
    url: jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

resilience4j:
  ratelimiter:
    instances:
      enrollmentRateLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms

server:
  port: 8080