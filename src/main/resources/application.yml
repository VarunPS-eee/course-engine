spring:
  application:
    name: course-engine

  datasource:
    url: jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

# Resilience4j In-Memory Rate Limiter Config
resilience4j:
  ratelimiter:
    instances:
      enrollmentRateLimiter:
        limitForPeriod: 5          # Allow max 5 requests
        limitRefreshPeriod: 1s     # Per 1 second window
        timeoutDuration: 0ms       # Reject immediately if limit exceeded

server:
  port: 8080